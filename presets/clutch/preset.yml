schema_version: "1.0"

preset:
  id: "clutch"
  name: "Clutch Spec Kit Rules"
  version: "1.0.0"
  description: "Clutch rules layered over the core Spec Kit commands"
  author: "saturdayarvo-clutch"

requires:
  speckit_version: ">=1.3.2"

provides:
  templates:
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Require an Out of scope statement"
      strategy: "wrap"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Ask only material questions"
      strategy: "wrap"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "No research agents; one fact in one file"
      strategy: "wrap"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Required tests, citations and the artifact check"
      strategy: "wrap"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Reporting bar, one batch of fixes and a bounded re-check"
      strategy: "wrap"
